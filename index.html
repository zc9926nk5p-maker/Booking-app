h1{font:600 30px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;color:var(--accent)}
h2{font:600 23px/1.15 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:22px 0 8px;color:var(--accent)}
h3{font:600 21px/1.15 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0;color:var(--accent)}
.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.lang{display:flex;gap:4px;flex:none}
.lang button{border:1px solid #a9a9a3;background:transparent;color:#3a3b1f;padding:3px 10px;font:600 12px 'Barlow',Arial,sans-serif;cursor:pointer;border-radius:2px}
.lang button[aria-pressed="true"]{background:#3b2a20;color:#fff;border-color:#3b2a20}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:0;background:var(--khaki);color:var(--khakiInk);border-radius:2px;padding:7px 13px;font:500 14px 'Barlow',Arial,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:block}
.mappane{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{display:block;width:100%;text-align:left;padding:0;border:1px solid var(--line);border-top:3px solid var(--khaki);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;border-radius:3px;overflow:hidden}
.tile:hover{border-color:var(--burg)}
.pw{display:block;position:relative}
.ph{display:block;width:100%;aspect-ratio:2/1;background-size:cover;background-position:center}
.pw .num{position:absolute;left:8px;top:8px;width:26px;height:26px;font-size:13px}
.pw .pill{position:absolute;left:8px;bottom:8px;margin:0}
.tb{display:block;padding:8px 10px 10px}
.tn{display:block;font:600 20px/1.1 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;color:var(--accent)}
.ts{display:block;font-size:13px;color:var(--muted)}
.tm{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tb .pill.self{margin:4px 0 0}
.hero{height:120px;background-size:cover;background-position:center;border:1px solid var(--line);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--khaki);border-radius:3px;padding:14px 16px}
.ch{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.num{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 14px 'Barlow',Arial,sans-serif;color:#fff;flex:none}
.num.l1{background:var(--l1line)}.num.l2{background:var(--l2line)}.num.l3{background:var(--l3line)}.num.l4{background:var(--l4line)}
.pill{display:inline-block;font:600 12px 'Barlow',Arial,sans-serif;padding:2px 9px;border-radius:2px;margin-top:4px}
.pill.l1{background:var(--l1bg);color:var(--l1)}.pill.l2{background:var(--l2bg);color:var(--l2)}.pill.l3{background:var(--l3bg);color:var(--l3)}.pill.l4{background:var(--l4bg);color:var(--l4)}
.sum{margin:0 0 8px;font-size:15px}
.meta{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:2px;padding:9px 15px;font:600 14px 'Barlow',Arial,sans-serif;letter-spacing:.02em;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.burg{background:var(--burg);border-color:var(--burg);color:#fff}
.btn.added{background:var(--l1bg);color:var(--l1);border-color:var(--l1line)}
.back{border:0;background:none;color:var(--link);font:600 14px 'Barlow',Arial,sans-serif;cursor:pointer;padding:6px 0;margin-bottom:6px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}
.fact{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--khaki);border-radius:2px;padding:8px 12px}
.fact small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.fact span{font-weight:600;font-size:15px}
.days{list-style:none;padding:0;margin:0}
.days li{padding:10px 0;border-top:1px solid var(--line)}
.days li b{display:block;color:var(--link);font:600 15px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em}
.two{display:grid;gap:0 24px}
.ul{padding-left:20px;margin:6px 0}
.map{width:100%;height:auto;display:block;background:var(--mbg);border:1px solid var(--line);border-radius:3px}
.map .land{fill:var(--mland);stroke:var(--mlandS)}
.map .rt{cursor:pointer;transition:opacity .15s}
.map .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke}
.mappane .map{max-height:calc(100vh - 330px);margin:0 auto}
@media (min-width:900px){.mappane{max-height:calc(100vh - 32px);overflow-y:auto}}
.wl{display:block;width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.55);background:#fff;box-sizing:border-box}
.mapc{margin-bottom:10px}
.tabs{display:flex;margin:0 0 14px;border-bottom:2px solid var(--khaki)}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 19px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.03em;padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--burg)}
.rentwrap{max-width:820px}
.panel{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--khaki);border-radius:3px;padding:14px 16px;margin-bottom:14px}
details.panel summary{cursor:pointer;font-weight:600;color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:6px 5px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tbl .r{text-align:right;white-space:nowrap}
.step{display:inline-flex;align-items:center;gap:8px;flex:none}
.step button{width:36px;height:36px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:2px;font:600 20px 'Barlow',Arial,sans-serif;cursor:pointer;padding:0;line-height:1}
.step b{min-width:22px;text-align:center}
select{width:100%;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:2px;font:15px 'Barlow',Arial,sans-serif}
.tot{font:600 26px 'Barlow Condensed','Arial Narrow',Arial,sans-serif;color:var(--accent)}
.pill.self{background:var(--khaki);color:var(--khakiInk);margin-left:6px}
.sheet label{display:block;margin:10px 0 3px;font-size:13px;color:var(--muted)}
.sheet input,.sheet textarea{width:100%;padding:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:2px;font:15px 'Barlow',Arial,sans-serif}
.reqcard{grid-column:1/-1;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:2px dashed var(--khaki);border-radius:3px;padding:14px 16px;margin-top:6px}
.reqcard>div{flex:1 1 240px}
.rentwrap .reqcard{margin-top:18px}
.rmap{width:100%;height:440px;border:1px solid var(--line);border-radius:3px;background:var(--mbg)}
.rmap.rdetail{height:380px}
.mappane .rmap{height:calc(100vh - 290px);min-height:360px}
.rmk{background:transparent;border:0}
.rn{display:flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font:700 13px 'Barlow',Arial,sans-serif;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);box-sizing:border-box}
.wm{display:block;width:12px;height:12px;background:var(--burg);border:2px solid #fff;transform:rotate(45deg);margin:2px;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.rfail{padding:18px;color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--khaki);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:6px 6px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.trow button{border:0;background:none;color:var(--link);font:600 12px 'Barlow',Arial,sans-serif;cursor:pointer}
@media (min-width:700px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1fr 1fr}.sheetbg{align-items:center}.sheet{border-radius:6px}.banner{height:140px}.logo{width:150px}}
@media (min-width:900px){
.grid{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:24px;align-items:start}
.mappane{display:block;position:sticky;top:16px}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.dmapcol{position:sticky;top:16px}
h1{font-size:38px}
}

 ov:["This trip suits canoeists with little whitewater experience. Its closeness to Whitehorse makes it a popular getaway, but don’t expect absolute wilderness. The road is near the river in several places and there are a few cabins along the way to the Yukon River. The only Class III rapid (the Jaws of Death) can be portaged.","Diese Tour eignet sich für Kanuten mit wenig Wildwasser-Erfahrung. Die Nähe zu Whitehorse macht sie zu einem beliebten Ausflug, aber echte Wildnis darfst du nicht erwarten. An mehreren Stellen verläuft die Straße nahe am Fluss, und auf dem Weg zum Yukon River stehen einige Hütten. Die einzige Stromschnelle der Klasse III (Jaws of Death) kann umtragen werden."],

{id:"pelly",n:12,lvl:2,self:true,access:"road",wwc:["I–II (up to III at high water)","I–II (bei Hochwasser bis III)"],
 name:["Pelly River","Pelly River"],start:["Faro / Ross River","Faro / Ross River"],end:["Pelly Crossing / Dawson City","Pelly Crossing / Dawson City"],
 sum:["A big river with black bears and migrating birds. In June, high water raises every rapid by a class.","Ein großer Fluss mit Schwarzbären und Zugvögeln. Im Juni erhöht das Hochwasser jede Stromschnelle um eine Klasse."],
 ov:["The Pelly River begins in the Selwyn Mountains, an area known for hot summers and bitterly cold winters. With some luck you may see black bears searching for food on the southern slopes of the ranges. The river passes the Tintina Trench, where migratory birds are often seen in spring and late summer. In June the Pelly runs high: every whitewater section is rated one class higher and should be paddled only by experienced canoeists.","Der Pelly River entspringt in den Selwyn Mountains, einer Gegend mit heißen Sommern und eisig kalten Wintern. Mit etwas Glück siehst du Schwarzbären bei der Futtersuche an den Südhängen der Gebirgszüge. Der Fluss fließt am Tintina Trench vorbei, wo im Frühling und Spätsommer oft Zugvögel zu sehen sind. Im Juni führt der Pelly Hochwasser: Jeder Wildwasserabschnitt wird dann eine Klasse höher eingestuft und sollte nur von erfahrenen Kanuten befahren werden."],
 hi:[["Black bears and migratory birds","Schwarzbären und Zugvögel"],["Start in Faro, Ross River or Pelly Crossing","Start in Faro, Ross River oder Pelly Crossing"],["June high water: rapids rate a class higher","Juni-Hochwasser: Stromschnellen eine Klasse schwerer"]],

function titleBlock(){return '<h1>'+T("title")+'</h1><p class="sub">'+T("sub")+'</p>';}

function tripRange(r,k){var v=r.trips.map(function(t){return t[k];}),a=Math.min.apply(null,v),b=Math.max.apply(null,v);return a===b?String(a):a+"–"+b;}
function dl(r){return (r.self&&r.trips)?tripRange(r,"d")+" "+T("days"):r.days+" "+T("days");}
function tripPrices(r){var v=[];r.trips.forEach(function(t){if(t.p1){v.push(t.p1);}if(t.p2){v.push(t.p2);}});return Math.min.apply(null,v);}
function applyTrip(r,i){var t=r.trips[i],sf=state.self;sf.river=r.id;sf.trip=i;sf.put=t.put;sf.take=t.take;sf.days=t.d;sf.cat=t.p1?1:2;sf.fly=!!t.note;}
function detailSelf(r){
 var f='<div class="facts">'+fact(T("level"),T("lv"+r.lvl))+fact(T("wwc"),Lx(r.wwc))+fact(T("sDays"),tripRange(r,"d"))+fact(T("distance"),T("approx")+" "+num(tripRange(r,"km"))+" "+T("km"))+fact(T("access"),T(r.access))+fact(T("rentFrom"),money(tripPrices(r)))+'</div>';
 var tb='<table class="tbl"><tr><th>'+T("tripCol")+'</th><th class="r">km</th><th class="r">'+T("sDays")+'</th><th class="r">'+T("cat")+' 1</th><th class="r">'+T("cat")+' 2</th></tr>';
 r.trips.forEach(function(t){tb+='<tr><td>'+Lx(t.n)+'</td><td class="r">'+num(t.km)+'</td><td class="r">'+t.d+'</td><td class="r">'+(t.p1?money(t.p1):'–')+'</td><td class="r">'+(t.p2?money(t.p2):'–')+'</td></tr>';});
 tb+='</table>';
 var notes=[T("pkgNote")];
 var hasC1=r.trips.some(function(t){return t.p1;});
 notes.push(state.lang==="de"?("Jeder zusätzliche Paddeltag: "+(hasC1?"Kategorie 1 "+money(r.extra[0])+", Kategorie 2 "+money(r.extra[1]):money(r.extra[1]))+"."):("Each additional paddling day: "+(hasC1?"Category 1 "+money(r.extra[0])+", Category 2 "+money(r.extra[1]):money(r.extra[1]))+"."));
 r.trips.forEach(function(t){if(t.note){notes.push(Lx(t.n)+": "+Lx(t.note));}});
 if(r.drop.length){var dd=r.drop.map(function(x){return x[0]+" "+money(x[1]);}).join(", ");notes.push(state.lang==="de"?("Rückgabegebühr pro Kanu, wenn du keinen Abholtransfer buchst: "+dd+"."):("Drop-off fee per canoe if you don’t book the pick-up shuttle: "+dd+"."));}
 if(r.dep){notes.push(state.lang==="de"?("Rückzahlbare Kaution für Beschädigungen: 700 CAD (oder 500 EUR) pro Wildwasserkanu, bar bei Ankunft."):("Refundable damage deposit: CAD 700 (or EUR 500) per whitewater canoe, paid in cash on arrival."));}
 var main='<button class="back" data-a="back">'+T("back")+'</button>'+heroHtml(r)+
 '<div class="ch"><span class="num l'+r.lvl+'">'+r.n+'</span><div><h1 style="font-size:32px">'+Lx(r.name)+'</h1><span class="pill l'+r.lvl+'">'+T("lv"+r.lvl)+'</span><span class="pill self">'+T("selfOnly")+'</span></div></div>'+
 '<p>'+Lx(r.sum)+'</p>'+f+
 '<div class="acts"><button class="btn burg" data-a="inq" data-id="'+r.id+'">'+T("inquire")+'</button><button class="btn ghost" data-a="plan" data-id="'+r.id+'">'+T("planBtn")+'</button></div>'+
 '<h2>'+T("highlights")+'</h2><ul class="ul">'+r.hi.map(function(h){return '<li>'+Lx(h)+'</li>';}).join("")+'</ul>'+
 '<h2>'+T("ovH")+'</h2><p>'+Lx(r.ov)+'</p>'+
 '<h2>'+T("tripsH")+'</h2>'+tb+
 '<h2>'+T("know")+'</h2><ul class="ul">'+notes.map(function(x){return '<li>'+x+'</li>';}).join("")+'<li>'+T("gst5")+'</li></ul>';
 return '<div class="dgrid"><div>'+main+'</div><div class="dmapcol"><h2 style="margin-top:6px">'+T("route")+': '+Lx(r.start)+' → '+Lx(r.end)+'</h2>'+modeChips()+mapSVG(r.id)+'</div></div>';
}
function chips(){
 var s='<div class="chips">';
 for(var i=0;i<=4;i++){s+='<button class="chip" data-a="filter" data-id="'+i+'" aria-pressed="'+(state.filter===i)+'">'+(i===0?T("all"):T("lv"+i))+'</button>';}
 s+='</div><div class="chips">';
 [["tAll",0],["tGuided",1],["tSelf",2]].forEach(function(x){s+='<button class="chip" data-a="type" data-id="'+x[1]+'" aria-pressed="'+(state.type===x[1])+'">'+T(x[0])+'</button>';});
 return s+'</div>';
}

function addBtn(r){
 var on=state.trip.indexOf(r.id)>-1;
 return on?'<button class="btn added" data-a="rem" data-id="'+r.id+'">✓ '+T("added")+'</button>':'<button class="btn ghost" data-a="add" data-id="'+r.id+'">+ '+T("add")+'</button>';
}

function art(r){
 if(PH[r.id]){return '<span class="ph" style="background-image:url('+PH[r.id]+')"></span>';}
 return '<svg class="ph" viewBox="0 0 160 80" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="80" style="fill:var(--land)"/><path d="M0 62 L38 30 L58 48 L92 18 L128 52 L160 36 L160 80 L0 80Z" style="fill:var(--khaki)"/><path d="M-5 70 C40 52 70 82 110 64 S150 60 170 68" fill="none" style="stroke:var(--mwater)" stroke-width="5" stroke-linecap="round"/></svg>';
}
function heroHtml(r){return PH[r.id]?'<div class="hero" role="img" aria-label="'+Lx(r.name)+'" style="background-image:url('+PH[r.id]+')"></div>':'';}
function card(r){
 var parts=Lx(r.name).split(":"),m=dl(r);
 if(r.km){m+=' · '+T("approx")+' '+num(r.km)+' '+T("km");}
 return '<button class="tile" data-a="open" data-id="'+r.id+'" data-hl="'+r.id+'"><span class="pw">'+art(r)+'<span class="num l'+r.lvl+'">'+r.n+'</span><span class="pill l'+r.lvl+'">'+T("lv"+r.lvl)+'</span></span>'+
 '<span class="tb"><span class="tn">'+parts[0]+'</span>'+(parts[1]?'<span class="ts">'+parts[1].trim()+'</span>':'')+'<span class="tm">'+m+'</span>'+(r.self?'<span class="pill self">'+T("selfOnly")+'</span>':'')+'</span></button>';
}

function listView(){
 var items=R.filter(function(r){return (state.filter===0||r.lvl===state.filter)&&(state.type===0||(state.type===1&&!r.self)||(state.type===2&&r.self));});
 var s=tabs()+titleBlock()+chips()+'<div class="grid"><div class="cards">'+items.map(card).join("")+((state.filter===0&&state.type===0)?COMING.map(soonCard).join(""):"")+reqCard()+'</div><aside class="mappane" id="mainmap">'+mapControls()+mapSVG(null)+'</aside></div>';
 return s;
}

function soonCard(c){
 return '<button class="tile" data-a="open" data-id="'+c.id+'"><span class="pw">'+art(c)+'<span class="pill self">'+T("soon")+'</span></span><span class="tb"><span class="tn">'+Lx(c.name)+'</span></span></button>';
}
function soonView(id){
 var c=null;COMING.forEach(function(x){if(x.id===id){c=x;}});
 if(!c){return "";}
 return '<div class="rentwrap"><button class="back" data-a="back">'+T("back")+'</button>'+heroHtml(c)+'<h1>'+Lx(c.name)+'</h1><p><span class="pill self" style="margin:0">'+T("soon")+'</span></p><p>'+T("soonTxt")+'</p><div class="acts"><a class="btn burg" href="'+CONTACT+'" target="_blank" rel="noopener">'+T("inquire")+'</a></div></div>';
}

 '<div class="ch"><span class="num l'+r.lvl+'">'+r.n+'</span><div><h1 style="font-size:32px">'+Lx(r.name)+'</h1><span class="pill l'+r.lvl+'">'+T("lv"+r.lvl)+'</span></div></div>'+
 '<p>'+Lx(r.sum)+'</p>'+f+

 '<h2>'+T("highlights")+'</h2><ul class="ul">'+r.hi.map(function(h){return '<li>'+Lx(h)+'</li>';}).join("")+'</ul>'+
 '<h2>'+T("itin")+'</h2><ol class="days">'+r.it.map(function(d){return '<li><b>'+dayLabel(d[0])+'</b>'+d[1+li()]+'</li>';}).join("")+'</ol>'+

 return '<div class="dgrid"><div>'+main+'</div><div class="dmapcol"><h2 style="margin-top:6px">'+T("route")+': '+Lx(r.start)+' → '+Lx(r.end)+'</h2>'+modeChips()+mapSVG(r.id)+'</div></div>';

function fact(a,b){return '<div class="fact"><small>'+a+'</small><span>'+b+'</span></div>';}

function tripDays(){var n=0;state.trip.forEach(function(id){n+=byId(id).days;});return n;}

var ABOUT="http://www.wolf-adventure-tours.de/eng/about_us.htm";
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function attr(x){return esc(x).replace(/"/g,"&quot;");}
function hasTrip(){return state.trip.length>0||state.self.saved||state.custom;}
function tripKind(){return state.trip.length?"guided":(state.self.saved?"self":(state.custom?"custom":null));}
function kindLabel(){var k=tripKind();return k==="guided"?T("kGuided"):(k==="custom"?T("kCustom"):T("kSelf"));}
function tripRiver(){if(state.trip.length){return byId(state.trip[0]);}if(tripKind()==="custom"){return null;}return state.self.river?byId(state.self.river):null;}
function tripName(){if(tripKind()==="custom"){return T("customName");}var r=tripRiver();return r?Lx(r.name).split(":")[0]:T("selfTrip");}
function customFields(){var f=state.form;
 return '<label for="f-river">'+T("fRiver")+'</label><input id="f-river" type="text" data-f="river" value="'+attr(f.river)+'" placeholder="'+attr(T("fRiverPh"))+'"><label>'+T("fMode")+'</label><div class="chips">'+[["guided","mGuided"],["self","mSelf"],["unsure","mUnsure"]].map(function(x){return '<button class="chip" data-a="cmode" data-id="'+x[0]+'" aria-pressed="'+(f.mode===x[0])+'">'+T(x[1])+'</button>';}).join("")+'</div>';
}
function reqCard(){return '<div class="reqcard"><div><h3>'+T("reqTitle")+'</h3><p class="sub" style="margin:4px 0 0">'+T("reqTxt")+'</p></div><button class="btn burg" data-a="custom">'+T("reqBtn")+'</button></div>';}
function tripBar(){
 if(!hasTrip()){return "";}
 return '<div class="bar"><div><strong>'+T("trip")+'</strong> · '+esc(tripName())+' · '+kindLabel()+'</div><button class="btn" data-a="sheet">'+T("open")+'</button></div>';
}

function sheetView(){
 if(!state.sheet){return "";}
 var k=tripKind(),r=tripRiver(),f=state.form,s=state.self;
 var o='<div class="sheetbg" data-a="sheetbg"><div class="sheet" role="dialog" aria-modal="true"><h2>'+T("yourtrip")+'</h2>';
 if(state.sent){
  return o+'<div class="panel"><h3>'+T("sentTitle")+'</h3><p class="sub" style="margin:6px 0">'+T("sentDemo")+'</p><pre style="white-space:pre-wrap;font:inherit;font-size:14px;margin:8px 0 0">'+esc(summary())+'</pre></div><div class="acts"><button class="btn ghost" data-a="newtrip">'+T("newTrip")+'</button><button class="btn ghost" data-a="sheetx">'+T("close")+'</button></div></div></div>';
 }
 if(!k){
  return o+'<p class="sub">'+T("empty")+'</p><div class="acts"><button class="btn" data-a="gotoPlan">'+T("planBtn")+'</button><button class="btn ghost" data-a="sheetx">'+T("browse")+'</button></div></div></div>';
 }
 o+='<div class="panel"><div class="ch">'+(r?'<span class="num l'+r.lvl+'">'+r.n+'</span>':'')+'<div><h3>'+esc(tripName())+'</h3><span class="pill self" style="margin:4px 0 0">'+kindLabel()+'</span></div></div>';
 if(k==="guided"){o+='<p class="sub" style="margin:6px 0 0">'+r.days+' '+T("days")+' · '+T("lv"+r.lvl)+' · '+T("guidedSize")+': '+Lx(r.group)+'</p><p class="sub" style="margin:4px 0 0">'+T("price")+': '+(r.price?T("priceBS"):T("onreq"))+'</p>';}
 else if(k==="custom"){o+='<p class="sub" style="margin:6px 0 0">'+T("reqTxt")+'</p>';}
 else{o+='<p class="sub" style="margin:6px 0 0">'+esc(selfLine().replace(T("selfTrip")+": ",""))+'</p>';}
 o+='<div class="acts" style="margin-top:10px">'+(k==="self"?'<button class="btn ghost" data-a="editplan">'+T("editPlan")+'</button>':'')+'<button class="btn ghost" data-a="clear">'+T("remove")+'</button></div></div>';
 var today=new Date().toISOString().slice(0,10);
 o+='<div class="panel">'+(k==="custom"?customFields():'')+'<label for="f-date">'+T("fDate")+'</label><input id="f-date" type="date" data-f="date" value="'+attr(f.date)+'" min="'+today+'">'+
  '<div class="row" style="margin-top:8px"><span>'+T("fGroup")+'</span><span class="step"><button data-a="sstep" data-id="people:-1" aria-label="−">−</button><b>'+s.people+'</b><button data-a="sstep" data-id="people:1" aria-label="+">+</button></span></div>'+
  '<label for="f-name">'+T("fName")+'</label><input id="f-name" type="text" data-f="name" value="'+attr(f.name)+'" autocomplete="name">'+
  '<label for="f-email">'+T("fEmail")+'</label><input id="f-email" type="email" data-f="email" value="'+attr(f.email)+'" autocomplete="email" inputmode="email">'+
  '<label for="f-notes">'+T("fNotes")+'</label><textarea id="f-notes" data-f="notes" rows="3" placeholder="'+attr(T("fNotesPh"))+'">'+esc(f.notes)+'</textarea>'+
  (state.formErr?'<p style="color:var(--link);margin:8px 0 0;font-weight:600">'+(k==="custom"?T("needAll"):T("needNameEmail"))+'</p>':'')+'</div>';
 return o+'<div class="acts"><a class="btn burg" data-a="submit" href="'+ABOUT+'" target="_blank" rel="noopener">'+T("submit")+'</a><button class="btn ghost" data-a="copy">'+T("copy")+'</button><button class="btn ghost" data-a="sheetx">'+T("close")+'</button></div></div></div>';
}

function render(){
 disposeMap();
 var y=window.scrollY,shEl=document.querySelector&&document.querySelector(".sheet"),shTop=shEl?shEl.scrollTop:0;
 document.documentElement.lang=state.lang;
 document.title="Wolf Adventure Tours – "+(state.lang==="de"?"Flussentdecker":"River explorer");
 document.getElementById("app").innerHTML=head()+'<div class="wrap"><div class="banner" role="img" aria-label="Canoeists on a Yukon river with a grizzly bear on the bank"></div>'+(state.view==="detail"?detailView():(state.view==="rent"?rentView():listView()))+'</div>'+tripBar()+sheetView();
 window.scrollTo(0,y);
 var sh2=document.querySelector&&document.querySelector(".sheet");if(sh2){sh2.scrollTop=shTop;}
 if(state.mapMode!=="illus"){initRealMap();}
}

function saveTrip(){store("wat_trip",JSON.stringify(state.trip));}

function summary(){
 var t=T("groupmy")+"\n",r=tripRiver(),f=state.form,k=tripKind();
 if(k==="guided"&&r){t+="- "+Lx(r.name)+" ("+T("kGuided")+", "+r.days+" "+T("days")+", "+T("lv"+r.lvl)+")\n";}
 else if(k==="self"){t+="- "+tripName()+": "+selfLine()+"\n";}
 else if(k==="custom"){var mm={guided:"mGuided",self:"mSelf",unsure:"mUnsure"};t+="- "+T("customName")+": "+(f.river||"–")+" ("+(f.mode?T(mm[f.mode]):"–")+")\n";}
 t+=T("fDate")+": "+(f.date||"–")+"\n"+T("fGroup")+": "+state.self.people+"\n"+T("fName")+": "+(f.name||"–")+"\n"+T("fEmail")+": "+(f.email||"–");
 if(f.notes){t+="\n"+T("fNotes")+": "+f.notes;}
 return t;
}

document.addEventListener("click",function(e){
 var el=e.target.closest("[data-a]");if(!el){return;}
 var a=el.getAttribute("data-a"),id=el.getAttribute("data-id");
 if(a==="sheetbg"&&e.target!==el){return;}
 if(a==="lang"){state.lang=id;store("wat_lang",id);render();}
 else if(a==="filter"){state.filter=parseInt(id,10);render();}
 else if(a==="open"){state.view="detail";state.sel=id;state.sheet=false;render();window.scrollTo(0,0);}
 else if(a==="back"){state.view="list";state.sel=null;render();window.scrollTo(0,0);}
 else if(a==="add"){state.custom=false;state.trip=[id];state.self.saved=false;saveTrip();persistSelf();render();}
 else if(a==="rem"){state.trip=state.trip.filter(function(x){return x!==id;});saveTrip();render();}
 else if(a==="sheet"){state.sheet=true;render();}
 else if(a==="sheetx"||a==="sheetbg"){state.sheet=false;render();}
 else if(a==="tab"){state.view=id;state.sel=null;render();window.scrollTo(0,0);}
 else if(a==="type"){state.type=parseInt(id,10);render();}
 else if(a==="plan"){var rr=byId(id),sf=state.self;if(rr.trips){applyTrip(rr,rr.def||0);}else{var pl=PLAN[id];sf.river=id;sf.trip=-1;sf.put=pl.put;sf.take=pl.take;sf.cat=pl.cat;sf.days=pl.days;sf.fly=!!pl.fly;}persistSelf();state.view="rent";state.sel=null;state.sheet=false;render();var pe=document.getElementById("plan");if(pe&&pe.scrollIntoView){pe.scrollIntoView();}else{window.scrollTo(0,0);}}
 else if(a==="sstep"){var pr=id.split(":"),k=pr[0],dl=parseInt(pr[1],10),sf2=state.self;
  if(k.indexOf("g_")===0){var gk=k.slice(2);sf2.gear[gk]=Math.max(0,Math.min(9,(sf2.gear[gk]||0)+dl));}
  else{var lim={boats:[1,10],days:[1,60],people:[1,12],sat:[0,5]}[k];sf2[k]=Math.max(lim[0],Math.min(lim[1],(+sf2[k]||0)+dl));}
  persistSelf();render();}
 else if(a==="sset"){var q=id.split(":");state.self[q[0]]=(q[0]==="sat")?q[1]==="1":parseInt(q[1],10);persistSelf();render();}
 else if(a==="selfsave"){state.custom=false;state.self.saved=true;state.trip=[];saveTrip();persistSelf();render();}
 else if(a==="selfrm"){state.self.saved=false;persistSelf();render();}
 else if(a==="mapmode"){state.mapMode=id;render();}
 else if(a==="mapview"){state.mv=id;render();}
 else if(a==="mapl"){state[id]=!state[id];render();}
 else if(a==="inq"){
  state.custom=false;
  if(id==="self"){state.self.saved=true;state.trip=[];}
  else{var ir=byId(id);if(ir&&!ir.self){state.trip=[id];state.self.saved=false;}else if(ir){if(state.self.river!==id||state.self.trip<0){applyTrip(ir,ir.def||0);}state.self.saved=true;state.trip=[];}}
  state.sent=false;state.formErr=false;state.sheet=true;saveTrip();persistSelf();render();}
 else if(a==="custom"){state.trip=[];state.self.saved=false;state.custom=true;state.sent=false;state.formErr=false;state.sheet=true;saveTrip();persistSelf();render();}
 else if(a==="cmode"){state.form.mode=id;render();}
 else if(a==="editplan"){state.sheet=false;state.view="rent";state.sel=null;render();var pe2=document.getElementById("plan");if(pe2&&pe2.scrollIntoView){pe2.scrollIntoView();}else{window.scrollTo(0,0);}}
 else if(a==="gotoPlan"){state.sheet=false;state.view="rent";state.sel=null;render();window.scrollTo(0,0);}
 else if(a==="newtrip"){state.trip=[];state.self.saved=false;state.sent=false;state.formErr=false;state.form={date:"",name:"",email:"",notes:"",river:"",mode:""};state.custom=false;saveTrip();persistSelf();state.sheet=false;render();}
 else if(a==="submit"){var f2=state.form;if(!String(f2.name).trim()||(tripKind()==="custom"&&!String(f2.river).trim())||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(f2.email).trim())){e.preventDefault();state.formErr=true;render();return;}state.formErr=false;setTimeout(function(){state.sent=true;render();},0);}
 else if(a==="clear"){state.custom=false;state.trip=[];state.self.saved=false;saveTrip();persistSelf();state.sheet=false;render();}
 else if(a==="copy"){
  var txt=summary(),done=function(){el.textContent=T("copied");};
  try{navigator.clipboard.writeText(txt).then(done,function(){});}catch(err){}
 }
});

function hl(id){
 if(state.mapMode!=="illus"&&window.__marks){
  Object.keys(window.__lines||{}).forEach(function(k){window.__lines[k].setStyle({opacity:(!id||k===id)?0.95:0.3,weight:(id&&k===id)?5.5:3.5});});
  Object.keys(window.__marks).forEach(function(k){window.__marks[k].setOpacity((!id||k===id)?1:0.45);});
  return;}
 var svg=document.getElementById("mainmap");if(!svg){return;}
 svg.querySelectorAll(".rt").forEach(function(g){g.style.opacity=(!id||g.getAttribute("data-id")===id)?1:0.25;});
}
document.addEventListener("change",function(e){var el=e.target,k=el.getAttribute&&el.getAttribute("data-sel");if(k){if(k==="trip"){applyTrip(byId(state.self.river),parseInt(el.value,10));}else{state.self[k]=el.value;}persistSelf();render();}});
document.addEventListener("input",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-f");if(k){state.form[k]=e.target.value;}});
document.addEventListener("mouseover",function(e){var c=e.target.closest("[data-hl]");if(c){hl(c.getAttribute("data-hl"));}});
document.addEventListener("mouseout",function(e){var c=e.target.closest("[data-hl]");if(c){hl(null);}});

render();
</script>
</body>
</html>
